apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-config
  namespace: flowforge
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "flowforge"
  REAPER_INTERVAL_MS: "5000"
  RETRY_BACKOFF_SECONDS: "5"
  DEFAULT_TASK_TIMEOUT_SECONDS: "60"
  DEFAULT_MAX_RETRIES: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: flowforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: flowforge/control-plane:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: control-plane-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: flowforge
spec:
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
