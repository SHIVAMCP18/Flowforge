server:
  port: 8080

spring:
  application:
    name: flowforge-control-plane
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowforge}
    username: ${DB_USER:flowforge}
    password: ${DB_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

flowforge:
  scheduler:
    reaper-interval-ms: ${REAPER_INTERVAL_MS:5000}
    retry-backoff-seconds: ${RETRY_BACKOFF_SECONDS:5}
    default-task-timeout-seconds: ${DEFAULT_TASK_TIMEOUT_SECONDS:60}
    default-max-retries: ${DEFAULT_MAX_RETRIES:3}
  cors:
    # Comma-separated origins allowed to call /api/** (supports patterns like https://*.vercel.app).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.flowforge: INFO
